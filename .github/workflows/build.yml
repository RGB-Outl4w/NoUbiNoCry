name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # needed to publish releases on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        shell: cmd
        run: build.cmd package

      - uses: actions/upload-artifact@v4
        with:
          name: NoUbiNoCry
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $zip = Get-Item "dist\NoUbiNoCry-$env:TAG.zip" -ErrorAction SilentlyContinue
          if (-not $zip) { throw "Tag $env:TAG does not match version.h (built: $((Get-ChildItem dist).Name))" }

          # Release notes = this version's CHANGELOG section + install steps
          $version = $env:TAG.Substring(1)
          $section = ((Get-Content CHANGELOG.md -Raw) -split '(?m)^## ') |
            Where-Object { $_.StartsWith("[$version]") } | Select-Object -First 1
          if (-not $section) { throw "CHANGELOG.md has no entry for $version" }
          $notes = ($section -split "`n", 2)[1].Trim()
          $notes += "`n`n### Install`nExtract ``dinput8.dll`` into the game's ``bin`` folder (next to ``fc3_blooddragon.exe``). See the [README](https://github.com/$env:GITHUB_REPOSITORY#installation) for details."
          Set-Content notes.md $notes -Encoding utf8

          gh release create $env:TAG $zip.FullName --title "NoUbiNoCry $env:TAG" --notes-file notes.md
